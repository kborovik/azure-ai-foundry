[project]
name = "talos"
version = "0.1.0"
description = "CLI to deploy and test the Contoso Demo Bank credit-policy agent on Microsoft Foundry."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-ai-projects>=2.0.0,<3",
    "azure-identity>=1.21.0",
    "azure-search-documents==12.1.0b2",
    "click>=8.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
]

[project.scripts]
talos = "talos.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]
python-preference = "managed"

[tool.ruff]
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
addopts = "-m unit"
markers = [
    "unit: corpus contract and CLI tests, no Azure",
    "ingestion: live blob + indexer status",
    "retrieval: live Foundry IQ retrieve",
    "agent: live Foundry agent Responses API",
    "teams: optional Teams/Activity path",
]
testpaths = ["tests"]
timeout = 180
